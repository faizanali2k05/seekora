services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: seekora
      POSTGRES_USER: seekora
      POSTGRES_PASSWORD: seekora
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seekora -d seekora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      SEEKORA_DATABASE_URL: postgresql+psycopg://seekora:seekora@postgres:5432/seekora
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    build: ./backend
    command: ["python", "scripts/seed.py"]
    environment:
      SEEKORA_DATABASE_URL: postgresql+psycopg://seekora:seekora@postgres:5432/seekora
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build: ./backend
    environment:
      SEEKORA_DATABASE_URL: postgresql+psycopg://seekora:seekora@postgres:5432/seekora
      SEEKORA_REDIS_URL: redis://redis:6379/0
      SEEKORA_CORS_ORIGINS: http://localhost:3000
      SEEKORA_ADMIN_API_KEY: ${SEEKORA_ADMIN_API_KEY:-seekora-dev-key-change-me}
      SEEKORA_RAG_PROVIDER: ${SEEKORA_RAG_PROVIDER:-extractive}
      SEEKORA_RAG_MODEL: ${SEEKORA_RAG_MODEL:-local-extractive-v1}
      SEEKORA_RAG_BASE_URL: ${SEEKORA_RAG_BASE_URL:-https://api.openai.com/v1}
      SEEKORA_RAG_API_KEY: ${SEEKORA_RAG_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.crawler"]
    environment:
      SEEKORA_DATABASE_URL: postgresql+psycopg://seekora:seekora@postgres:5432/seekora
      SEEKORA_REDIS_URL: redis://redis:6379/0
      SEEKORA_ADMIN_API_KEY: ${SEEKORA_ADMIN_API_KEY:-seekora-dev-key-change-me}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
